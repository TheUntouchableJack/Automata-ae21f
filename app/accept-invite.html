<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="acceptInvite.pageTitle">Accept invitation - Royalty</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../i18n/i18n.css">
    <style>
        html, body { min-height: 100vh; margin: 0; padding: 0; background: var(--color-bg-secondary) !important; }
        .auth-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 440px; padding: 24px; margin: 0 auto; box-sizing: border-box; }
        .auth-card { width: 100%; box-sizing: border-box; background: var(--color-bg); border-radius: var(--radius-xl);
            border: 1px solid var(--color-border); padding: 36px; box-shadow: var(--shadow-lg); }
        @media (max-width: 480px) { .auth-card { padding: 24px; } }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-header .logo { display: inline-flex; margin-bottom: 20px; }
        .auth-header h1 { font-size: 1.5rem; margin-bottom: 8px; overflow-wrap: anywhere; }
        .auth-header p { color: var(--color-text-secondary); font-size: 15px; line-height: 1.5; margin: 0; }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-field { flex: 1; min-width: 0; }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field label { font-size: 14px; font-weight: 500; color: var(--color-text); }
        .form-field input { padding: 12px 14px; font-family: inherit; font-size: 15px; border: 1px solid var(--color-border);
            border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); outline: none; min-width: 0; }
        .form-field input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }
        .form-field input[readonly] { background: var(--color-bg-secondary); color: var(--color-text-secondary); }
        .field-hint { font-size: 12px; color: var(--color-text-muted); }
        .notice { padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
        .notice.error { background: rgba(239, 68, 68, 0.1); color: var(--color-error); }
        .notice.info { background: var(--color-bg-secondary); color: var(--color-text); }
        .notice.success { background: rgba(34, 197, 94, 0.1); color: var(--color-success); text-align: center; }
        .switch-link { text-align: center; font-size: 14px; color: var(--color-text-muted); margin: 4px 0 0; }
        .switch-link button { background: none; border: 0; padding: 0; font: inherit; color: var(--color-primary); font-weight: 500; cursor: pointer; }
        .switch-link button:hover { text-decoration: underline; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: var(--color-text-muted); }
        [hidden] { display: none !important; }
        .btn-loading { position: relative; color: transparent !important; pointer-events: none; }
        .btn-loading::after { content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Analytics: PostHog via the first-party /ingest proxy (netlify.toml).
         Cookieless on public pages, so there is no consent banner. Session
         replay + masking inside /app only. See js/analytics.js. -->
    <script src="/js/analytics-config.js?v=1" defer></script>
    <script src="/js/notrack.js?v=1" defer></script>
    <script src="/js/analytics.js?v=2" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo">
                    <img src="/logo.svg" alt="Royalty" class="logo-icon">
                    <span class="logo-text">Royalty</span>
                </a>
                <h1 id="invite-title" data-i18n="acceptInvite.checking">Checking your invitation…</h1>
                <p id="invite-subtitle" hidden></p>
            </div>

            <div class="notice error" id="invite-error" role="alert" hidden></div>

            <!-- Not signed in: create an account for the invited email -->
            <form class="auth-form" id="create-form" hidden novalidate>
                <div class="form-row">
                    <div class="form-field">
                        <label for="first-name" data-i18n="auth.firstName">First Name</label>
                        <input type="text" id="first-name" autocomplete="given-name" maxlength="60" required>
                    </div>
                    <div class="form-field">
                        <label for="last-name" data-i18n="auth.lastName">Last Name</label>
                        <input type="text" id="last-name" autocomplete="family-name" maxlength="60">
                    </div>
                </div>
                <div class="form-field">
                    <label for="create-email" data-i18n="auth.email">Email</label>
                    <input type="email" id="create-email" readonly>
                </div>
                <div class="form-field">
                    <label for="create-password" data-i18n="auth.password">Password</label>
                    <input type="password" id="create-password" autocomplete="new-password" minlength="8" required>
                    <span class="field-hint" data-i18n="acceptInvite.passwordHint">At least 8 characters</span>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="create-btn" data-i18n="acceptInvite.createBtn">Create account and join</button>
                <p class="switch-link"><span data-i18n="acceptInvite.haveAccount">Already have a Royalty account with this email?</span>
                    <button type="button" id="to-signin" data-i18n="acceptInvite.signInLink">Sign in</button></p>
            </form>

            <!-- Not signed in: sign in with the invited email -->
            <form class="auth-form" id="signin-form" hidden novalidate>
                <div class="form-field">
                    <label for="signin-email" data-i18n="auth.email">Email</label>
                    <input type="email" id="signin-email" readonly>
                </div>
                <div class="form-field">
                    <label for="signin-password" data-i18n="auth.password">Password</label>
                    <input type="password" id="signin-password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="signin-btn" data-i18n="acceptInvite.signInBtn">Sign in and join</button>
                <p class="switch-link"><button type="button" id="to-create" data-i18n="acceptInvite.newAccountLink">New here? Create an account</button></p>
                <p class="switch-link"><a href="/app/forgot-password.html" data-i18n="auth.forgotPassword">Forgot password?</a></p>
            </form>

            <!-- Signed in as the invited email -->
            <div class="auth-form" id="join-section" hidden>
                <div class="notice info" id="signed-in-as"></div>
                <button type="button" class="btn btn-primary btn-block" id="join-btn">Join</button>
            </div>

            <!-- Signed in as someone else -->
            <div class="auth-form" id="wrong-section" hidden>
                <div class="notice info" id="wrong-text"></div>
                <button type="button" class="btn btn-secondary btn-block" id="signout-btn" data-i18n="acceptInvite.signOut">Sign out</button>
            </div>

            <!-- After sign-up: confirm the email -->
            <div class="auth-form" id="check-email-section" hidden>
                <div class="notice success"><strong data-i18n="acceptInvite.checkEmailTitle">Check your email</strong><br><span id="check-email-text"></span></div>
            </div>

            <div class="notice success" id="joined-section" role="status" hidden></div>
        </div>
        <a href="/" class="back-link" data-i18n="auth.backToHome">Back to home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../i18n/i18n.js?v=14"></script>
    <script src="workspace.js?v=1"></script>
    <script src="auth.js?v=15"></script>
    <script src="accept-invite.js?v=1"></script>
</body>
</html>
