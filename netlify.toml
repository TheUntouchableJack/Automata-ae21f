# Netlify Configuration

# publish and command are independent — publish stays "." (the repo root is the
# site) while the command generates the static blog pages and a fresh sitemap.
# The trailing "|| true" is deliberate: without it a transient Supabase failure
# turns a routine sitemap refresh into a failed deploy that publishes nothing.
# Both scripts already refuse to clobber good output when the API is unreachable.
# Adding any command makes Netlify run a dependency install (~30-60s).
[build]
  publish = "."
  command = "node scripts/prerender-blog.mjs && node scripts/generate-sitemap.mjs || true"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net https://challenges.cloudflare.com https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://api.anthropic.com https://cdn.jsdelivr.net https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://fcm.googleapis.com https://fcmregistrations.googleapis.com; frame-src https://js.stripe.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'"

# Custom-domain / subdomain -> customer-app router.
# Runs before redirects; first-party hosts, assets, and /app/* early-return inside the function.
[[edge_functions]]
  path = "/*"
  function = "domain-router"

# Belt-and-braces for the repo paths 404'd below: if a path ever slips through a
# redirect, it still must not be indexed.
[[headers]]
  for = "/database/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
