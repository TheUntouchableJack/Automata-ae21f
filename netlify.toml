# Blog post clean URLs — REMOVED (SEO 1.2).
# This rewrite matched every path under /blog/ and always returned 200 against
# post.html's "Loading..." shell. With zero published articles that made 100% of
# /blog/* a soft 404. Paths now fall through to the real 404 below.
# Restored (or made unnecessary) in Phase 3a once articles are prerendered to
# real blog/<slug>.html files — Netlify resolves those for /blog/<slug> directly.

# Public roadmap clean URL
[[redirects]]
  from = "/roadmap"
  to = "/roadmap.html"
  status = 200

# Royalty vs. loyalty explainer clean URL.
# Canonical is the .html form (see the canonical scheme note in the sitemap), so
# this is a convenience alias only — it must not be the URL we advertise.
[[redirects]]
  from = "/royalty-vs-loyalty"
  to = "/royalty-vs-loyalty.html"
  status = 200

