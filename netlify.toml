# Netlify Configuration

# publish and command are independent — publish stays "." (the repo root is the
# site) while the command generates the static blog pages and a fresh sitemap.
# The two scripts are separated by ";" and each carries its own "|| true": they
# are independent jobs, and a prerender failure must not skip the sitemap. With
# "&&" a single bad article froze the sitemap on every subsequent deploy, and the
# trailing "|| true" bound to the whole chain, so the deploy still reported green.
# The "|| true" itself is deliberate: without it a transient Supabase failure
# turns a routine sitemap refresh into a failed deploy that publishes nothing.
# Both scripts keep their existing output rather than clobbering it when the API
# is unreachable or returns an unrecognised shape.
# Adding any command makes Netlify run a dependency install (~30-60s).
[build]
  publish = "."
  command = "node scripts/prerender-blog.mjs || true; node scripts/generate-sitemap.mjs || true"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone=(self) is required by the ViibeView composer, which records
    # video WITH sound — the feed has a sound toggle, so a silent-only recorder
    # would be a strange product. This read microphone=() (disallowed for
    # everyone, including this origin), which made getUserMedia({video, audio})
    # reject outright; the app then reported "Camera access denied", blaming the
    # camera for a microphone the site had blocked itself. Like the CSP above,
    # it only failed in production — `npm run dev` sends no Permissions-Policy.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    # PostHog is served first-party through the /ingest/* proxy below, so it needs
    # no extra script-src/connect-src origins — 'self' already covers it. That is
    # the point of the proxy: it also survives ad blockers, which block the
    # posthog.com origins outright.
    # worker-src blob: is required by the session-replay recorder, which runs in a
    # web worker. Without it replay fails SILENTLY — the page looks fine and no
    # recording is ever produced. The previous GA4 install died exactly this way
    # (googletagmanager.com was never in script-src), so verify with:
    #   curl -sI https://royaltyapp.ai | grep -i content-security-policy
    #
    # media-src blob: is required by the ViibeView composer. Two <video> elements
    # are pointed at a MediaRecorder blob the page just created: the recording
    # preview (showRecordingPreview) and the offscreen frame-grab that produces
    # venue_media.thumbnail_url (generateThumbnail). Without it BOTH fail
    # silently in production while working perfectly under `npm run dev`, which
    # sets no CSP at all — the preview shows an empty box and thumbnail_url stays
    # NULL forever. blob: is same-origin content this page authored; it adds no
    # third-party origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net https://challenges.cloudflare.com https://cdnjs.cloudflare.com https://www.gstatic.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://api.anthropic.com https://cdn.jsdelivr.net https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://fcm.googleapis.com https://fcmregistrations.googleapis.com; frame-src https://js.stripe.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'"

