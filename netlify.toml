# Cache static assets
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Repo files are publicly served because publish = "." with no build output dir.
# Netlify has no "exclude" for that, so these forced 404s are the block.
# force = true is REQUIRED: a non-forced redirect loses to a file that exists on disk.
# Must stay above the /* catch-all below.
[[redirects]]
  from = "/database/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

