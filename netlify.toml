    Cache-Control = "public, max-age=31536000, immutable"

# PostHog analytics, reverse-proxied as first-party.
#
# Why proxy instead of loading us-assets.i.posthog.com directly: our users are SMB
# owners and a large share run ad blockers, which block the posthog.com origins by
# name. Served from our own domain the requests are indistinguishable from any
# other asset, and the CSP needs no third-party origins at all.
#
# The `host` lines are part of PostHog's documented Netlify config and are load-
# bearing — without them the upstream rejects the request. /static/* and /array/*
# come from the ASSETS host; everything else (ingest, decide, replay) from the
# INGEST host. Order matters: the specific asset rules must precede the catch-all.
#
# force = true is required — nothing exists on disk at /ingest, so without it the
# final /* -> 404.html rule would win.
#
# CAVEAT: PostHog documents that this proxy does NOT work on *.netlify.app
# domains (Netlify rewrites content-encoding headers there). Verify on
# https://royaltyapp.ai only — a deploy-preview URL will fail and that is expected.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  host = "us.i.posthog.com"
  status = 200
  force = true

# Repo files are publicly served because publish = "." with no build output dir.
# Netlify has no "exclude" for that, so these forced 404s are the block.
# force = true is REQUIRED: a non-forced redirect loses to a file that exists on disk.
# Must stay above the /* catch-all below.
[[redirects]]
  from = "/database/*"
  to = "/404.html"
  status = 404
  force = true

