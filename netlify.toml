# Force redirect Netlify subdomain to custom domain
[[redirects]]
  from = "https://automata-jay.netlify.app/*"
  to = "https://royaltyapp.ai/:splat"
  status = 301
  force = true

# Redirects for SPA-like behavior (optional)
[[redirects]]
  from = "/app/*"
  to = "/app/:splat"
  status = 200

# Customer app slug routing (/a/{slug} → customer-app)
[[redirects]]
  from = "/a/:slug/checkin"
  to = "/customer-app/app.html?slug=:slug&action=checkin"
  status = 200

[[redirects]]
  from = "/a/:slug/app"
  to = "/customer-app/app.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/a/:slug/social"
  to = "/customer-app/social.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/a/:slug"
  to = "/customer-app/index.html?slug=:slug"
  status = 200

# Blog post clean URLs — REMOVED (SEO 1.2).
# This rewrite matched every path under /blog/ and always returned 200 against
# post.html's "Loading..." shell. With zero published articles that made 100% of
# /blog/* a soft 404. Paths now fall through to the real 404 below.
# Restored (or made unnecessary) in Phase 3a once articles are prerendered to
# real blog/<slug>.html files — Netlify resolves those for /blog/<slug> directly.

# Public roadmap clean URL
[[redirects]]
  from = "/roadmap"
  to = "/roadmap.html"
  status = 200

# Royalty vs. loyalty explainer clean URL.
# Canonical is the .html form (see the canonical scheme note in the sitemap), so
# this is a convenience alias only — it must not be the URL we advertise.
[[redirects]]
  from = "/royalty-vs-loyalty"
  to = "/royalty-vs-loyalty.html"
  status = 200

# Clean URLs for legal/contact pages
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Custom error pages
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
